[package]
name = "mnemosoma-py"
description = "Python bindings for the Mnemosoma memory engine."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
name = "_core"
crate-type = ["cdylib"]

[dependencies]
mnemosoma-core = { path = "../mnemosoma-core" }
pyo3 = { version = "0.30", features = ["abi3-py310"] }
serde = "1"
serde_json = "1"
