name: Release

# Builds wheels for Linux, macOS and Windows plus a source distribution on
# every run. Pushing a version tag such as v0.1.0 also attaches them to a
# GitHub release. Publishing to PyPI and crates.io is switched on by the
# repository variables described in RELEASING.md.

on:
  push:
    tags: ["v*"]
  # Build and test wheels, without publishing, when packaging changes.
  pull_request:
    paths:
      - ".github/workflows/release.yml"
      - "pyproject.toml"
      - "Cargo.toml"
      - "crates/*/Cargo.toml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  wheels:
    name: Wheels (${{ matrix.platform.name }})
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - { name: linux-x86_64, runner: ubuntu-latest, target: x86_64, manylinux: auto }
          - { name: linux-aarch64, runner: ubuntu-latest, target: aarch64, manylinux: auto }
          - { name: macos-arm64, runner: macos-latest, target: aarch64 }
          - { name: macos-x86_64, runner: macos-latest, target: x86_64 }
          - { name: windows-x64, runner: windows-latest, target: x64 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.platform.target }}
          manylinux: ${{ matrix.platform.manylinux }}
          args: --release --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.platform.name }}
          path: dist

  sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist

  smoke-test:
    name: Install the wheel and run the tests
    needs: wheels
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          name: wheels-linux-x86_64
          path: dist
      - run: |
          pip install dist/*.whl pytest "langchain-core>=1.0" "langgraph>=1.0" "mcp>=1.2"
          mv python python-src   # make sure the tests import the installed wheel
          pytest -q
          python evals/run.py --check

  github-release:
    name: Attach the wheels to a GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [wheels, sdist, smoke-test]
    runs-on: ubuntu-latest
    permissions:
      contents: write   # to create the release; every other job only reads
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Take the notes for this version from the changelog
        run: python .github/release_notes.py "$GITHUB_REF_NAME" "$GITHUB_REPOSITORY" > notes.md
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --title "Mnemosoma ${GITHUB_REF_NAME#v}" --notes-file notes.md

  publish-pypi:
    name: Publish to PyPI
    if: startsWith(github.ref, 'refs/tags/v') && vars.PUBLISH_TO_PYPI == 'true'
    needs: [wheels, sdist, smoke-test]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write   # trusted publishing; no API token is stored
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@release/v1

  publish-crates:
    name: Publish to crates.io
    if: startsWith(github.ref, 'refs/tags/v') && vars.PUBLISH_TO_CRATES_IO == 'true'
    needs: smoke-test
    runs-on: ubuntu-latest
    environment: crates-io
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo publish -p mnemosoma-core
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
