name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    name: Format, lint and type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Rust formatting
        run: cargo fmt --all -- --check

      - name: Clippy, warnings as errors
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Python formatting, lint and types
        run: |
          pip install ruff mypy "langchain-core>=1.0" "langgraph>=1.0" "langsmith>=0.4" "mcp>=1.2"
          ruff format --check python tests evals examples benchmarks
          ruff check python tests evals examples benchmarks
          mypy

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Rust tests
        run: cargo test -p mnemosoma-core

      - name: Load benchmark with leak check
        run: cargo run --release -p mnemosoma-core --example load -- 50000 10

      - name: Build the Python package
        shell: bash
        run: |
          python -m venv .venv
          if [ -f .venv/Scripts/activate ]; then source .venv/Scripts/activate; else source .venv/bin/activate; fi
          pip install maturin pytest "langchain-core>=1.0" "langgraph>=1.0" "langsmith>=0.4" "mcp>=1.2"
          maturin develop --release
          pytest -q
          python examples/quickstart.py
          python examples/team_graph.py
          python evals/run.py --check
